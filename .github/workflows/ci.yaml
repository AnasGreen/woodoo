name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      APP_DEBUG: "1"
      APP_SECRET: ci-test-secret-not-sensitive
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/connector?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "sync://"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, intl, pdo_pgsql, redis
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: php bin/console cache:warmup --env=test --no-interaction
      - run: vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
