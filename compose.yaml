name: woodoo

x-app: &app
  build:
    context: .
    target: development
  environment:
    APP_ENV: dev
    APP_SECRET: ${APP_SECRET:-local-development-secret}
    DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-connector}?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
  volumes:
    - ./:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    healthcheck:
      test: [CMD-SHELL, "php -r 'exit(fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/health]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-connector}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *app
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --no-interaction
    healthcheck:
      test: [CMD-SHELL, "ps | grep '[m]essenger:consume' >/dev/null"]
      interval: 20s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  vendor:
